<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Centro de avisos | OTIUM
    </title>

    <meta
        name="description"
        content="Consulta tus avisos y eventos de interés en OTIUM."
    >

    <meta
        name="theme-color"
        content="#111827"
    >

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                #f5f7fb;

            color:
                #1f2937;

        }


        button,
        a {

            font-family:
                inherit;

        }


        /* =====================================================
           CONTENEDOR GENERAL
        ===================================================== */

        .page-container {

            width:
                min(1180px, calc(100% - 32px));

            margin:
                0 auto;

        }


        /* =====================================================
           CONTENIDO
        ===================================================== */

        main {

            padding:
                35px 0 60px;

        }


        /* =====================================================
           CABECERA
        ===================================================== */

        .page-header {

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                20px;

            margin-bottom:
                25px;

        }


        .page-title-area h1 {

            margin:
                0 0 8px;

            font-size:
                clamp(28px, 4vw, 38px);

            line-height:
                1.15;

            color:
                #111827;

        }


        .page-title-area p {

            margin:
                0;

            color:
                #6b7280;

            font-size:
                15px;

        }


        /* =====================================================
           CONTADOR
        ===================================================== */

        .alerts-counter {

            display:
                inline-flex;

            align-items:
                center;

            justify-content:
                center;

            min-width:
                42px;

            height:
                42px;

            padding:
                0 12px;

            border-radius:
                999px;

            background:
                #111827;

            color:
                #ffffff;

            font-size:
                15px;

            font-weight:
                700;

        }


        .alerts-counter.empty {

            background:
                #e5e7eb;

            color:
                #6b7280;

        }


        /* =====================================================
           BARRA DE ACCIONES
        ===================================================== */

        .alerts-toolbar {

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                15px;

            padding:
                16px 18px;

            margin-bottom:
                20px;

            background:
                #ffffff;

            border:
                1px solid #e5e7eb;

            border-radius:
                14px;

            box-shadow:
                0 4px 18px rgba(0, 0, 0, 0.05);

        }


        .alerts-toolbar-text {

            color:
                #4b5563;

            font-size:
                14px;

        }


        #markAllReadButton {

            border:
                0;

            background:
                transparent;

            color:
                #2563eb;

            cursor:
                pointer;

            font-size:
                14px;

            font-weight:
                700;

            padding:
                8px 10px;

            border-radius:
                8px;

        }


        #markAllReadButton:hover {

            background:
                #eff6ff;

        }


        #markAllReadButton:disabled {

            opacity:
                0.5;

            cursor:
                not-allowed;

        }


        /* =====================================================
           MENSAJE
        ===================================================== */

        .alerts-message {

            display:
                none;

            margin-bottom:
                20px;

            padding:
                14px 16px;

            border-radius:
                12px;

            font-size:
                14px;

        }


        .alerts-message.visible {
            display: block;
        }


        .alerts-message.info {

            background:
                #eff6ff;

            color:
                #1d4ed8;

            border:
                1px solid #bfdbfe;

        }


        .alerts-message.success {

            background:
                #ecfdf5;

            color:
                #047857;

            border:
                1px solid #a7f3d0;

        }


        .alerts-message.warning {

            background:
                #fffbeb;

            color:
                #b45309;

            border:
                1px solid #fde68a;

        }


        .alerts-message.error {

            background:
                #fef2f2;

            color:
                #b91c1c;

            border:
                1px solid #fecaca;

        }


        /* =====================================================
           LOGIN
        ===================================================== */

        .login-required {

            display:
                none;

            background:
                #ffffff;

            border:
                1px solid #e5e7eb;

            border-radius:
                18px;

            padding:
                45px 25px;

            text-align:
                center;

            box-shadow:
                0 5px 25px rgba(0, 0, 0, 0.05);

        }


        .login-required.visible {
            display: block;
        }


        .login-icon {

            font-size:
                48px;

            margin-bottom:
                15px;

        }


        .login-required h2 {

            margin:
                0 0 10px;

            color:
                #111827;

        }


        .login-required p {

            max-width:
                600px;

            margin:
                0 auto 22px;

            color:
                #6b7280;

            line-height:
                1.6;

        }


        .login-button {

            display:
                inline-flex;

            align-items:
                center;

            justify-content:
                center;

            min-height:
                44px;

            padding:
                0 20px;

            border-radius:
                10px;

            background:
                #111827;

            color:
                #ffffff;

            text-decoration:
                none;

            font-weight:
                700;

        }


        .login-button:hover {

            background:
                #1f2937;

        }


        /* =====================================================
           CONTENIDO AVISOS
        ===================================================== */

        .alerts-content {

            display:
                none;

        }


        .alerts-content.visible {

            display:
                block;

        }


        /* =====================================================
           LISTA
        ===================================================== */

        .alerts-list {

            display:
                flex;

            flex-direction:
                column;

            gap:
                15px;

        }


        /* =====================================================
           AVISO
        ===================================================== */

        .alert-card {

            position:
                relative;

            background:
                #ffffff;

            border:
                1px solid #e5e7eb;

            border-radius:
                16px;

            padding:
                20px;

            box-shadow:
                0 4px 18px rgba(0, 0, 0, 0.04);

            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease;

        }


        .alert-card:hover {

            transform:
                translateY(-1px);

            box-shadow:
                0 7px 24px rgba(0, 0, 0, 0.07);

        }


        .alert-card.unread {

            border-left:
                4px solid #2563eb;

            background:
                #f8fbff;

        }


        .alert-card-top {

            display:
                flex;

            align-items:
                flex-start;

            justify-content:
                space-between;

            gap:
                15px;

            margin-bottom:
                12px;

        }


        .alert-type {

            display:
                inline-flex;

            align-items:
                center;

            gap:
                7px;

            color:
                #2563eb;

            font-size:
                13px;

            font-weight:
                700;

        }


        .alert-date {

            color:
                #6b7280;

            font-size:
                12px;

            white-space:
                nowrap;

        }


        .alert-card h2 {

            margin:
                0 0 9px;

            color:
                #111827;

            font-size:
                21px;

            line-height:
                1.3;

        }


        .alert-meta {

            display:
                flex;

            flex-wrap:
                wrap;

            gap:
                8px;

            margin-bottom:
                12px;

        }


        .alert-meta-item {

            display:
                inline-flex;

            align-items:
                center;

            padding:
                5px 9px;

            background:
                #f3f4f6;

            border-radius:
                999px;

            color:
                #4b5563;

            font-size:
                12px;

        }


        .alert-description {

            margin:
                0 0 13px;

            color:
                #4b5563;

            font-size:
                14px;

            line-height:
                1.6;

        }


        .alert-reason {

            margin:
                0 0 16px;

            padding:
                10px 12px;

            background:
                #f9fafb;

            border-radius:
                9px;

            color:
                #6b7280;

            font-size:
                13px;

        }


        .alert-actions {

            display:
                flex;

            flex-wrap:
                wrap;

            gap:
                9px;

        }


        .alert-action {

            display:
                inline-flex;

            align-items:
                center;

            justify-content:
                center;

            min-height:
                38px;

            padding:
                0 14px;

            border-radius:
                9px;

            border:
                1px solid #d1d5db;

            background:
                #ffffff;

            color:
                #374151;

            text-decoration:
                none;

            cursor:
                pointer;

            font-size:
                13px;

            font-weight:
                700;

        }


        .alert-action:hover {

            background:
                #f9fafb;

        }


        .alert-action.primary {

            border-color:
                #2563eb;

            background:
                #2563eb;

            color:
                #ffffff;

        }


        .alert-action.primary:hover {

            background:
                #1d4ed8;

        }


        /* =====================================================
           ESTADO VACÍO
        ===================================================== */

        .empty-state {

            background:
                #ffffff;

            border:
                1px solid #e5e7eb;

            border-radius:
                18px;

            padding:
                50px 25px;

            text-align:
                center;

            box-shadow:
                0 4px 18px rgba(0, 0, 0, 0.04);

        }


        .empty-state-icon {

            font-size:
                48px;

            margin-bottom:
                15px;

        }


        .empty-state h2 {

            margin:
                0 0 10px;

            color:
                #111827;

        }


        .empty-state p {

            max-width:
                600px;

            margin:
                0 auto 20px;

            color:
                #6b7280;

            line-height:
                1.6;

        }


        .empty-state a {

            display:
                inline-flex;

            align-items:
                center;

            justify-content:
                center;

            min-height:
                42px;

            padding:
                0 17px;

            border-radius:
                9px;

            background:
                #111827;

            color:
                #ffffff;

            text-decoration:
                none;

            font-weight:
                700;

            font-size:
                14px;

        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (
            max-width: 700px
        ) {

            .page-container {

                width:
                    min(
                        100% - 20px,
                        1180px
                    );

            }


            main {

                padding:
                    25px 0 45px;

            }


            .page-header {

                align-items:
                    flex-start;

            }


            .alerts-toolbar {

                align-items:
                    flex-start;

                flex-direction:
                    column;

            }


            .alert-card-top {

                flex-direction:
                    column;

                gap:
                    7px;

            }


            .alert-date {

                white-space:
                    normal;

            }


            .alert-card {

                padding:
                    16px;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         MENÚ OTIUM
    ===================================================== -->

    <div id="menu-container"></div>


    <!-- =====================================================
         CONTENIDO PRINCIPAL
    ===================================================== -->

    <main>

        <div class="page-container">


            <!-- =================================================
                 ENCABEZADO
            ================================================= -->

            <section class="page-header">

                <div class="page-title-area">

                    <h1>
                        🔔 Mis avisos
                    </h1>

                    <p>
                        Aquí encontrarás eventos que coinciden
                        con tus preferencias.
                    </p>

                </div>


                <div
                    id="alertsCounter"
                    class="alerts-counter empty"
                    aria-label="Avisos no leídos"
                >
                    0
                </div>

            </section>


            <!-- =================================================
                 MENSAJES
            ================================================= -->

            <div
                id="alertsMessage"
                class="alerts-message"
                role="status"
                aria-live="polite"
            ></div>


            <!-- =================================================
                 USUARIO NO AUTENTICADO
            ================================================= -->

            <section
                id="loginRequired"
                class="login-required"
            >

                <div class="login-icon">
                    🔐
                </div>

                <h2>
                    Inicia sesión para ver tus avisos
                </h2>

                <p>
                    Tus avisos son personales y se generan
                    de acuerdo con las preferencias que
                    configuraste en OTIUM.
                </p>

                <a
                    href="mis-avisos.html"
                    class="login-button"
                >
                    Ir a Mis avisos
                </a>

            </section>


            <!-- =================================================
                 CONTENIDO AUTENTICADO
            ================================================= -->

            <section
                id="alertsContent"
                class="alerts-content"
            >


                <!-- =============================================
                     BARRA DE ACCIONES
                ============================================== -->

                <div class="alerts-toolbar">

                    <div
                        id="alertsToolbarText"
                        class="alerts-toolbar-text"
                    >
                        Cargando tus avisos...
                    </div>


                    <button
                        id="markAllReadButton"
                        type="button"
                    >
                        Marcar todos como leídos
                    </button>

                </div>


                <!-- =============================================
                     LISTA
                ============================================== -->

                <div
                    id="alertsList"
                    class="alerts-list"
                ></div>


            </section>


        </div>

    </main>


    <!-- =====================================================
         MENÚ OTIUM
    ===================================================== -->

    <script
        src="js/menu.js?v=20260901"
        defer
    ></script>


    <!-- =====================================================
         CENTRO DE AVISOS
    ===================================================== -->

    <script
        type="module"
        src="js/centro-avisos.js?v=20260901"
    ></script>


</body>

</html>
