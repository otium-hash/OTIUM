<!DOCTYPE html>

<html lang="es">



<head>



    <meta charset="UTF-8">



    <meta

        name="viewport"

        content="width=device-width, initial-scale=1.0">



    <title>

        OTIUM - Eventos

    </title>



    <link

        rel="stylesheet"

        href="css/style.css">



    <style>



/* =====================================================

   OTIUM - EVENTOS

\===================================================== */



.eventos-page {



    max-width: 1250px;



    margin: 0 auto;



    padding: 120px 30px 60px;



}





/* =====================================================

   ENCABEZADO

\===================================================== */



.eventos-header {



    text-align: center;



    margin-bottom: 25px;



}





.eventos-header h1 {



    margin: 0 0 8px;



    font-size: 34px;



}





.eventos-header p {



    margin: 0;



    color: #666;



    font-size: 16px;



}





/* =====================================================

   FILTROS

\===================================================== */



.eventos-filtros {



    display: flex;



    flex-direction: column;



    gap: 12px;



    margin-bottom: 24px;



    padding: 16px;



    background: #fff;



    border-radius: 14px;



    box-shadow:

        0 4px 16px rgba(0,0,0,0.07);



}





/* =====================================================

   FILA PRINCIPAL

\===================================================== */



.filtros-principal {



    display: grid;



    grid-template-columns:

        minmax(0, 1fr)

        220px

        220px;



    gap: 12px;



}





/* =====================================================

   FILTROS SECUNDARIOS

\===================================================== */



.filtros-secundarios {



    display: grid;



    grid-template-columns:

        repeat(4, minmax(0, 1fr));



    gap: 10px;



}





/* =====================================================

   FILTROS AVANZADOS

\===================================================== */



.filtros-avanzados {



    display: grid;



    grid-template-columns:

        repeat(4, minmax(0, 1fr));



    gap: 10px;



}





/* =====================================================

   CAMPOS

\===================================================== */



.eventos-filtros input,

.eventos-filtros select {



    width: 100%;



    box-sizing: border-box;



    padding: 11px 13px;



    border: 1px solid #ddd;



    border-radius: 9px;



    font-size: 14px;



    background: #fff;



    color: #333;



}





.eventos-filtros input:focus,

.eventos-filtros select:focus {



    outline: none;



    border-color: #102a43;



    box-shadow:

        0 0 0 2px

        rgba(16,42,67,0.08);



}





/* =====================================================

   FILTRO AVANZADO

\===================================================== */



.filtro-avanzado {



    display: flex;



    align-items: center;



    gap: 8px;



    min-height: 40px;



    padding: 8px 10px;



    border: 1px solid #e1e5ea;



    border-radius: 9px;



    background: #f8fafc;



    cursor: pointer;



    font-size: 13px;



    color: #344054;



}





.filtro-avanzado:hover {



    background: #f2f4f7;



}





.filtro-avanzado input {



    width: auto;



    margin: 0;



}





/* =====================================================

   ACCIONES

\===================================================== */



.filtros-acciones {



    display: flex;



    justify-content: flex-end;



    gap: 10px;



}





\#clearFilters {



    padding: 9px 15px;



    border: 1px solid #d0d5dd;



    border-radius: 8px;



    background: #fff;



    color: #344054;



    font-size: 13px;



    font-weight: 600;



    cursor: pointer;



}





\#clearFilters:hover {



    background: #f2f4f7;



}





/* =====================================================

   CONTADOR

\===================================================== */



\#eventosResultadoInfo {



    margin-bottom: 14px;



    color: #667085;



    font-size: 13px;



}





/* =====================================================

   EVENTOS

\===================================================== */



\#eventosContainer {



    display: grid;



    grid-template-columns:

        repeat(3, minmax(0, 1fr));



    gap: 16px;



    align-items: start;



}





/* =====================================================

   TARJETA

\===================================================== */



\#eventosContainer .evento-card {



    width: 100%;



    min-width: 0;



    display: flex;



    flex-direction: column;



    overflow: hidden;



    box-sizing: border-box;



    padding: 10px 12px 12px;



    background: #fff;



    border-radius: 12px;



    border: 1px solid #e5e7eb;



    box-shadow:

        0 3px 12px

        rgba(0,0,0,0.07);



}





\#eventosContainer .evento-card:hover {



    box-shadow:

        0 6px 16px

        rgba(0,0,0,0.10);



}





/* =====================================================

   IMAGEN

\===================================================== */



\#eventosContainer .evento-imagen {



    width: 100%;



    height: 58px;



    flex: 0 0 58px;



    overflow: hidden;



    display: flex;



    align-items: center;



    justify-content: center;



    background: #fff;



    border-radius: 8px;



    margin: 0 0 8px;



}





\#eventosContainer .evento-imagen-img {



    display: block;



    width: auto !important;



    height: auto !important;



    max-width: 100px !important;



    max-height: 46px !important;



    object-fit: contain !important;



    object-position: center;



}





\#eventosContainer

.evento-imagen-img.default-event-image {



    width: 34px !important;



    height: 34px !important;



    max-width: 34px !important;



    max-height: 34px !important;



    object-fit: contain !important;



}





/* =====================================================

   TÍTULO

\===================================================== */



\#eventosContainer .evento-card h3 {



    margin: 0 0 6px;



    font-size: 15px;



    line-height: 1.25;



    color: #102a43;



    overflow-wrap: anywhere;



}





/* =====================================================

   INFORMACIÓN

\===================================================== */



\#eventosContainer .evento-card p {



    margin: 3px 0;



    color: #555;



    font-size: 11.5px;



    line-height: 1.3;



    overflow-wrap: anywhere;



}





/* =====================================================

   BOTÓN

\===================================================== */



\#eventosContainer .btn-mostrar-mas {



    display: block;



    margin-top: 8px;



    padding: 7px 9px;



    text-align: center;



    text-decoration: none;



    border-radius: 7px;



    background: #102a43;



    color: #fff;



    font-size: 11.5px;



    font-weight: 600;



}





\#eventosContainer .btn-mostrar-mas:hover {



    background: #183b5c;



}





/* =====================================================

   SIN EVENTOS

\===================================================== */



.sin-eventos {



    grid-column: 1 / -1;



    text-align: center;



    padding: 40px 20px;



    background: #fff;



    border-radius: 14px;



    color: #666;



}





/* =====================================================

   RESPONSIVE

\===================================================== */



/* =====================================================
   FILTROS MÓVILES
   En smartphone se mantiene visible la búsqueda y
   el resto de filtros se abre/cierra con un botón.
===================================================== */

.mobile-filters-toggle {
    display: none;
}

@media (max-width: 650px) {

    .mobile-filters-toggle {
        width: 100%;
        min-height: 46px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 0 0 10px;
        padding: 11px 14px;
        border: 1px solid #dfe4ea;
        border-radius: 10px;
        background: #fff;
        color: #102a43;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        box-sizing: border-box;
    }

    .mobile-filters-toggle:hover {
        background: #f8fafc;
    }

    .mobile-filters-toggle:focus-visible {
        outline: none;
        border-color: #102a43;
        box-shadow: 0 0 0 3px rgba(16,42,67,0.10);
    }

    .mobile-filters-toggle-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        transition: transform .2s ease;
    }

    .mobile-filters-toggle[aria-expanded="true"]
    .mobile-filters-toggle-icon {
        transform: rotate(180deg);
    }

    .eventos-filtros.mobile-filters-collapsed {
        display: grid;
        grid-template-columns: 1fr;
        padding: 0;
        margin: 0 0 10px;
        background: transparent;
        border-radius: 0;
        box-shadow: none;
        gap: 0;
    }

    .eventos-filtros.mobile-filters-collapsed .filtros-principal {
        display: block;
    }

    .eventos-filtros.mobile-filters-collapsed
    .filtros-principal #search {
        display: block;
        width: 100%;
    }

    .eventos-filtros.mobile-filters-collapsed
    .filtros-principal select,
    .eventos-filtros.mobile-filters-collapsed .filtros-secundarios,
    .eventos-filtros.mobile-filters-collapsed .filtros-avanzados,
    .eventos-filtros.mobile-filters-collapsed .filtros-acciones {
        display: none;
    }

    .eventos-filtros.mobile-filters-open {
        display: flex;
        flex-direction: column;
    }

    .eventos-filtros.mobile-filters-open .filtros-principal,
    .eventos-filtros.mobile-filters-open .filtros-secundarios,
    .eventos-filtros.mobile-filters-open .filtros-avanzados,
    .eventos-filtros.mobile-filters-open .filtros-acciones {
        display: grid;
    }

    .eventos-filtros.mobile-filters-open .filtros-principal {
        grid-template-columns: 1fr;
    }

    .eventos-filtros.mobile-filters-open
    .filtros-principal #search {
        display: none;
    }
}

@media (max-width: 1050px) {



    .filtros-principal {



        grid-template-columns:

            minmax(0, 1fr)

            200px;



    }



    #subcategoryFilter {



        grid-column: 1 / -1;



    }



}





@media (max-width: 950px) {



    .eventos-page {



        padding:

            110px 20px 50px;



    }





    #eventosContainer {



        grid-template-columns:

            repeat(2, minmax(0, 1fr));



    }





    .filtros-secundarios,

    .filtros-avanzados {



        grid-template-columns:

            repeat(2, minmax(0, 1fr));



    }



}





@media (max-width: 650px) {



    .eventos-page {



        padding:

            100px 12px 40px;



    }





    .eventos-header h1 {



        font-size: 29px;



    }





    .filtros-principal {



        grid-template-columns: 1fr;



    }





    #subcategoryFilter {



        grid-column: auto;



    }





    .filtros-secundarios,

    .filtros-avanzados {



        grid-template-columns: 1fr;



    }





    #eventosContainer {



        grid-template-columns: 1fr;



        gap: 14px;



    }





    #eventosContainer

    .evento-imagen {



        height: 54px;



        flex-basis: 54px;



    }





    #eventosContainer

    .evento-imagen-img {



        max-width: 90px !important;



        max-height: 42px !important;



    }





    #eventosContainer

    .evento-imagen-img.default-event-image {



        width: 32px !important;



        height: 32px !important;



        max-width: 32px !important;



        max-height: 32px !important;



    }



}



    </style>

<body>





    <!-- =================================================

         MENÚ GLOBAL

    ================================================== -->



    <div id="menuOTIUM"></div>





    <!-- =================================================

         CONTENIDO

    ================================================== -->



    <main class="eventos-page">

                    </option>



                    <option value="Cine">

                    </option>



                    <option value="Arte">

                        Arte

                    </option>



                    <option value="Cultura">

                        Cultura

                    </option>



                    <option value="Deportes">

                        Deportes

                    </option>



                    <option value="Fiestas y celebraciones">

                        Fiestas y celebraciones

                    </option>



                    <option value="Vida nocturna">

                        Vida nocturna

                    </option>



                    <option value="Gastronomía">

                    </option>

            <div class="filtros-avanzados">

            <!-- ACCIONES -->



            <div class="filtros-acciones">

        </section>





        <!-- =================================================

    <!-- =================================================

         MENÚ

    ================================================== -->



   <!-- =================================================
     FILTROS MÓVILES
     Solo controla la presentación móvil.
     No modifica la lógica de eventos.js.
================================================== -->
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const toggle = document.getElementById("mobileFiltersToggle");
        const panel = document.getElementById("eventosFiltrosPanel");

        if (!toggle || !panel) return;

        const mediaQuery = window.matchMedia("(max-width: 650px)");

        const actualizarEstadoMovil = () => {
            if (mediaQuery.matches) {
                panel.classList.add("mobile-filters-collapsed");
                panel.classList.remove("mobile-filters-open");
                toggle.setAttribute("aria-expanded", "false");
            } else {
                panel.classList.remove("mobile-filters-collapsed");
                panel.classList.remove("mobile-filters-open");
                toggle.setAttribute("aria-expanded", "false");
            }
        };

        toggle.addEventListener("click", () => {
            if (!mediaQuery.matches) return;

            const abierto =
                toggle.getAttribute("aria-expanded") === "true";

            toggle.setAttribute(
                "aria-expanded",
                abierto ? "false" : "true"
            );

            panel.classList.toggle(
                "mobile-filters-collapsed",
                abierto
            );

            panel.classList.toggle(
                "mobile-filters-open",
                !abierto
            );
        });

        actualizarEstadoMovil();

        if (typeof mediaQuery.addEventListener === "function") {
            mediaQuery.addEventListener(
                "change",
                actualizarEstadoMovil
            );
        } else if (typeof mediaQuery.addListener === "function") {
            mediaQuery.addListener(actualizarEstadoMovil);
        }
    });
</script>
