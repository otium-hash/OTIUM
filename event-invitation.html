<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear invitación | OTIUM</title>
    <style>
        *{box-sizing:border-box}
        body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f7fb;color:#102a43}
        .page{min-height:100vh;padding:35px 15px 60px;display:flex;justify-content:center}
        .card{width:100%;max-width:900px;background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 15px 45px rgba(16,42,67,.12)}
        .header{background:#102a43;color:#fff;padding:28px;text-align:center}
        .logo{font-size:30px;font-weight:900;letter-spacing:3px}
        .subtitle{margin-top:7px;font-size:13px;opacity:.85;text-transform:uppercase;letter-spacing:1px}
        .content{padding:30px}
        .loading,.message{text-align:center;padding:35px 20px}
        .message{display:none;border-radius:12px;margin:20px 30px}
        .message.error{display:block;background:#fef2f2;color:#991b1b}
        .message.success{display:block;background:#ecfdf5;color:#065f46}
        .event-preview{display:none}
        .event-preview.visible{display:block}
        .preview{padding:20px;border:1px solid #e4e7ec;border-radius:16px;background:#f8fafc;margin-bottom:25px}
        .preview h1{margin:0 0 8px;font-size:28px}
        .preview p{margin:6px 0;color:#667085}
        .form-section{border-top:1px solid #e4e7ec;padding-top:25px}
        label{display:block;margin:0 0 7px;font-weight:700;font-size:14px}
        input,textarea{width:100%;padding:12px 13px;border:1px solid #d0d5dd;border-radius:10px;font:inherit;color:#102a43}
        textarea{min-height:120px;resize:vertical}
        .field{margin-bottom:18px}
        .check{display:flex;gap:10px;align-items:center;margin:5px 0 18px}
        .check input{width:auto}
        .hint{font-size:12px;color:#667085;margin-top:6px}
        .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:25px}
        button,a.button{border:0;border-radius:10px;padding:13px 18px;font-weight:800;text-decoration:none;cursor:pointer;font-size:14px}
        .primary{background:#ff7445;color:#fff}
        .secondary{background:#eef2f6;color:#102a43}
        button:disabled{opacity:.6;cursor:not-allowed}
        .result{display:none;margin-top:30px;padding:25px;border-radius:16px;background:#f8fafc;border:1px solid #e4e7ec;text-align:center}
        .result.visible{display:block}
        .qr{width:240px;height:240px;max-width:100%;margin:15px auto;display:block;border-radius:8px}
        .url{word-break:break-all;background:#fff;padding:12px;border:1px solid #e4e7ec;border-radius:10px;font-size:13px}
        .footer{padding:20px;text-align:center;border-top:1px solid #e4e7ec;color:#98a2b3;font-size:12px}
        @media(max-width:600px){.content{padding:20px}.message{margin:15px 20px}.preview h1{font-size:23px}.actions>*{width:100%;text-align:center}}
    </style>
</head>
<body>
<main class="page">
<section class="card">
    <header class="header">
        <div class="logo">OTIUM</div>
        <div class="subtitle">Crear invitación</div>
    </header>

    <div id="loading" class="loading">Cargando evento...</div>

    <div id="message" class="message"></div>

    <div id="content" class="content event-preview">
        <div class="preview">
            <h1 id="eventName">Evento</h1>
            <p id="eventDate"></p>
            <p id="eventLocation"></p>
        </div>

        <div class="form-section">
            <div class="field">
                <label for="invitationTitle">Título de la invitación</label>
                <input id="invitationTitle" type="text" maxlength="120" placeholder="Ej.: ¡Estás invitado!">
            </div>

            <div class="field">
                <label for="invitationMessage">Mensaje para tus invitados</label>
                <textarea id="invitationMessage" maxlength="1000" placeholder="Escribe un mensaje especial para tus invitados..."></textarea>
            </div>

            <label class="check">
                <input id="requiresConfirmation" type="checkbox">
                <span>Solicitar confirmación de asistencia</span>
            </label>

            <div id="confirmationUrlField" class="field" style="display:none">
                <label for="confirmationUrl">Enlace para confirmar asistencia</label>
                <input id="confirmationUrl" type="url" placeholder="https://...">
                <div class="hint">Opcional. Puede ser un formulario externo o un enlace de contacto.</div>
            </div>

            <div class="actions">
                <button id="createButton" class="primary" type="button">🎟️ Generar invitación y QR</button>
                <a class="button secondary" href="eventos.html">← Volver a eventos</a>
            </div>

            <div id="result" class="result">
                <h2>¡Invitación creada!</h2>
                <p>Comparte este código QR o el enlace con tus invitados.</p>
                <img id="qrImage" class="qr" alt="Código QR de la invitación">
                <div id="publicUrl" class="url"></div>
                <div class="actions" style="justify-content:center">
                    <button id="copyButton" class="secondary" type="button">📋 Copiar enlace</button>
                    <a id="openButton" class="button primary" target="_blank" rel="noopener noreferrer">Abrir invitación</a>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        Invitación generada con OTIUM
    </footer>
</section>
</main>

<script type="module" src="js/event-invitation.js?v=20260831"></script>
</body>
</html>
