<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Mapa de eventos | OTIUM
    </title>

    <meta
        name="description"
        content="Mapa de eventos y panoramas de OTIUM.">


    <!-- =========================================
         FUENTES
    ========================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">


    <!-- =========================================
         CSS GLOBAL OTIUM

         Contiene:
         - Navbar global
         - Menú usuario
         - Login
         - Notificaciones
         - Footer
         - Estructura general
    ========================================== -->

    <link
        rel="stylesheet"
        href="css/style.css">


    <!-- =========================================
         CSS ESPECÍFICO DEL MAPA
    ========================================== -->

    <link
        rel="stylesheet"
        href="css/map.css">


    <!-- =========================================
         LEAFLET CSS
    ========================================== -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

</head>


<body class="otium-map-page">


    <!-- =========================================
         MENÚ GLOBAL OTIUM

         menu.js crea aquí automáticamente
         el navbar completo.
    ========================================== -->

    <div id="menuOTIUM"></div>


    <!-- =========================================
         CONTENIDO PRINCIPAL
    ========================================== -->

    <main class="map-page-main">

        <div class="map-page-container">


            <!-- =================================
                 ENCABEZADO
            ================================== -->

            <div class="map-page-heading">

                <span class="eyebrow">
                    DESCUBRE CERCA DE TI
                </span>

                <h1>
                    Mapa de eventos
                </h1>

                <p>
                    Explora eventos y panoramas publicados
                    en OTIUM. Selecciona un marcador para
                    ver su información.
                </p>

            </div>


            <!-- =================================
                 MAPA
            ================================== -->

            <div class="map-page-card">

                <div id="otiumMap"></div>

                <div
                    id="mapPageStatus"
                    class="map-page-status">

                    Cargando eventos...

                </div>

            </div>


        </div>

    </main>


    <!-- =========================================
         MENÚ GLOBAL OTIUM
    ========================================== -->

    <script
        type="module"
        src="js/menu.js?v=20260904">
    </script>


    <!-- =========================================
         LOGIN

         IMPORTANTE:
         Este archivo faltaba en map.html.

         menu.js crea el botón #googleLogin,
         pero login.js es quien le asigna
         la función de iniciar sesión.
    ========================================== -->

    <script
        type="module"
        src="js/login.js?v=20260904">
    </script>


    <!-- =========================================
         LEAFLET JS

         IMPORTANTE:
         Debe cargarse antes de map-page.js
         porque map-page.js utiliza "L".
    ========================================== -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>


    <!-- =========================================
         JAVASCRIPT DEL MAPA
    ========================================== -->

    <script
        type="module"
        src="js/map-page.js">
    </script>


</body>

</html>
