<!DOCTYPE html>

<html lang="es">

<head>


<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>
    Mis entradas | OTIUM
</title>

<meta
    name="description"
    content="Consulta tus entradas para eventos en OTIUM.">

<link
    rel="preconnect"
    href="https://fonts.googleapis.com">

<link
    rel="preconnect"
    href="https://fonts.gstatic.com">

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

<link
    rel="stylesheet"
    href="css/style.css?v=20260903">


<style>

    /* =====================================================
       OTIUM
       MIS ENTRADAS
    ===================================================== */

    .tickets-page {

        max-width:
            900px;

        margin:
            0 auto;

        padding:
            120px 24px 70px;

    }


    .tickets-header {

        margin-bottom:
            35px;

    }


    .tickets-kicker {

        display:
            inline-block;

        margin-bottom:
            8px;

        font-size:
            12px;

        font-weight:
            800;

        letter-spacing:
            .12em;

        color:
            #64748b;

    }


    .tickets-header h1 {

        margin:
            0 0 12px;

        font-size:
            clamp(30px, 5vw, 44px);

        line-height:
            1.1;

        color:
            #102a43;

    }


    .tickets-header p {

        margin:
            0;

        max-width:
            650px;

        color:
            #64748b;

        font-size:
            16px;

        line-height:
            1.6;

    }


    /* =====================================================
       TARJETA
    ===================================================== */

    .tickets-card {

        padding:
            55px 35px;

        text-align:
            center;

        background:
            #ffffff;

        border:
            1px solid #e5e7eb;

        border-radius:
            20px;

        box-shadow:
            0 10px 35px rgba(
                15,
                23,
                42,
                .07
            );

    }


    .tickets-icon {

        width:
            70px;

        height:
            70px;

        margin:
            0 auto 22px;

        display:
            flex;

        align-items:
            center;

        justify-content:
            center;

        border-radius:
            18px;

        background:
            #fff4e8;

        font-size:
            34px;

    }


    .tickets-card h2 {

        margin:
            0 0 12px;

        color:
            #102a43;

        font-size:
            27px;

    }


    .tickets-card p {

        max-width:
            600px;

        margin:
            0 auto 25px;

        color:
            #64748b;

        line-height:
            1.65;

    }


    .tickets-coming {

        display:
            inline-flex;

        align-items:
            center;

        justify-content:
            center;

        padding:
            11px 20px;

        border-radius:
            10px;

        background:
            #fff4e8;

        color:
            #c2410c;

        font-size:
            13px;

        font-weight:
            800;

        letter-spacing:
            .04em;

    }


    /* =====================================================
       RESPONSIVE
    ===================================================== */

    @media (
        max-width: 700px
    ) {

        .tickets-page {

            padding:
                100px 16px 45px;

        }


        .tickets-card {

            padding:
                40px 22px;

        }


        .tickets-card h2 {

            font-size:
                24px;

        }

    }

</style>


</head>

<body class="otium-page">


<!-- =====================================================
     MENÚ GLOBAL
===================================================== -->

<div id="menuOTIUM"></div>


<!-- =====================================================
     CONTENIDO
===================================================== -->

<main class="tickets-page">


    <header class="tickets-header">

        <span class="tickets-kicker">
            OTIUM
        </span>

        <h1>
            Mis entradas
        </h1>

        <p>
            Aquí podrás consultar las entradas que
            compres para tus eventos.
        </p>

    </header>


    <section class="tickets-card">

        <div class="tickets-icon">
            🎫
        </div>


        <h2>
            Venta de entradas próximamente
        </h2>


        <p>
            OTIUM está preparando esta función.
            Próximamente podrás comprar entradas
            para eventos directamente desde la
            plataforma y consultar tus entradas
            desde este espacio.
        </p>


        <div class="tickets-coming">
            PRÓXIMAMENTE
        </div>

    </section>


</main>


<!-- =====================================================
     MENÚ
===================================================== -->

<script
    src="js/menu.js?v=20260903">
</script>


<!-- =====================================================
     LOGIN
===================================================== -->

<script
    type="module"
    src="js/login.js">
</script>


</body>

</html>
