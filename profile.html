<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Mi perfil | OTIUM
    </title>

    <link
        rel="stylesheet"
        href="css/style.css">


    <style>

        /* ==========================================
           PÁGINA DE PERFIL
        ========================================== */

        .profile-page {

            padding-top: 140px;

            min-height: 100vh;

            padding-left: 30px;

            padding-right: 30px;

            padding-bottom: 80px;

        }


        /* ==========================================
           TARJETA
        ========================================== */

        .profile-card {

            max-width: 850px;

            margin: 0 auto;

            background: white;

            border-radius: 25px;

            padding: 45px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.10);

        }


        /* ==========================================
           CABECERA
        ========================================== */

        .profile-header {

            text-align: center;

            margin-bottom: 40px;

        }


        .profile-photo {

            width: 120px;

            height: 120px;

            border-radius: 50%;

            object-fit: cover;

            margin-bottom: 20px;

            border: 4px solid #ff7a45;

        }


        .profile-header h1 {

            margin-bottom: 10px;

            color: #1f2937;

        }


        .profile-header p {

            color: #6b7280;

        }


        /* ==========================================
           INFORMACIÓN
        ========================================== */

        .profile-info {

            display: grid;

            gap: 15px;

            margin-bottom: 35px;

        }


        .profile-info-item {

            padding: 18px;

            background: #f5f7fb;

            border-radius: 15px;

        }


        .profile-info-item strong {

            display: block;

            margin-bottom: 6px;

            color: #374151;

        }


        .profile-info-item span {

            color: #6b7280;

            word-break: break-word;

        }


        /* ==========================================
           ESTADÍSTICAS
        ========================================== */

        .profile-stats {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 20px;

            margin-bottom: 35px;

        }


        .profile-stat {

            text-align: center;

            padding: 25px;

            border-radius: 18px;

            background: #f5f7fb;

        }


        .profile-stat strong {

            display: block;

            font-size: 32px;

            color: #ff7a45;

            margin-bottom: 8px;

        }


        .profile-stat span {

            color: #6b7280;

        }


        /* ==========================================
           BOTONES
        ========================================== */

        .profile-actions {

            display: flex;

            gap: 15px;

            justify-content: center;

            flex-wrap: wrap;

        }


        .profile-actions a,
        .profile-actions button {

            padding: 14px 25px;

            border: none;

            border-radius: 30px;

            background: #ff7a45;

            color: white;

            text-decoration: none;

            font-weight: 700;

            cursor: pointer;

        }


        .profile-actions a:hover,
        .profile-actions button:hover {

            opacity: 0.9;

        }


        /* ==========================================
           RESPONSIVE
        ========================================== */

        @media (max-width: 600px) {

            .profile-card {

                padding: 25px;

            }


            .profile-stats {

                grid-template-columns: 1fr;

            }

        }

    </style>

</head>


<body>


    <!-- ==========================================
         MENÚ GLOBAL OTIUM
    ========================================== -->

    <div id="menuOTIUM"></div>


    <!-- ==========================================
         CONTENIDO DEL PERFIL
    ========================================== -->

    <main class="profile-page">


        <div class="profile-card">


            <!-- ==================================
                 CABECERA
            ================================== -->

            <div class="profile-header">


                <img
                    id="profilePhoto"
                    class="profile-photo"
                    src="assets/icono.png"
                    alt="Foto de perfil">


                <h1
                    id="profileName">

                    Cargando...

                </h1>


                <p
                    id="profileEmail">

                    Cargando...

                </p>


            </div>


            <!-- ==================================
                 INFORMACIÓN
            ================================== -->

            <div class="profile-info">


                <div class="profile-info-item">

                    <strong>
                        👤 Nombre
                    </strong>

                    <span
                        id="profileNameInfo">

                        Cargando...

                    </span>

                </div>


                <div class="profile-info-item">

                    <strong>
                        ✉️ Correo electrónico
                    </strong>

                    <span
                        id="profileEmailInfo">

                        Cargando...

                    </span>

                </div>


                <div class="profile-info-item">

                    <strong>
                        🆔 ID de usuario
                    </strong>

                    <span
                        id="profileUserId">

                        Cargando...

                    </span>

                </div>


            </div>


            <!-- ==================================
                 ESTADÍSTICAS
            ================================== -->

            <div class="profile-stats">


                <div class="profile-stat">

                    <strong
                        id="eventsCount">

                        0

                    </strong>

                    <span>

                        Eventos publicados

                    </span>

                </div>


                <div class="profile-stat">

                    <strong
                        id="favoritesCount">

                        0

                    </strong>

                    <span>

                        Favoritos

                    </span>

                </div>


            </div>


            <!-- ==================================
                 ACCIONES
            ================================== -->

            <div class="profile-actions">


                <a
                    href="my-events.html">

                    📅 Mis eventos

                </a>


                <a
                    href="favoritos.html">

                    ❤️ Favoritos

                </a>


                <button
                    id="logoutProfile">

                    Cerrar sesión

                </button>


            </div>


        </div>


    </main>


    <!-- ==========================================
         MENÚ
    ========================================== -->

    <script
    type="module"
    src="js/menu.js?v=20260904">
</script>


    <!-- ==========================================
         LOGIN
    ========================================== -->

    <script
        type="module"
        src="js/login.js">
    </script>


    <!-- ==========================================
         PERFIL
    ========================================== -->

    <script
        type="module"
        src="js/profile.js">
    </script>


</body>

</html>
